<div class="tree-node">
  <div class="node-card" [ngClass]="node.type">
    <div class="node-header">
      <div class="toggle-icon">
        <span *ngIf="node.children && node.children.length > 0">•</span>
        <span *ngIf="!node.children || node.children.length === 0" class="placeholder">•</span>
      </div>

      <div class="node-title-group">
        <div class="node-title">{{ node.label }}</div>
        <div class="node-meta">{{ node.type }}</div>
      </div>
    </div>

    <div *ngIf="node.data" class="node-data">
      <pre>{{ node.data | json }}</pre>
    </div>
  </div>

  <div *ngIf="node.children && node.children.length > 0" class="node-children">
    <app-tree-node
      *ngFor="let child of node.children"
      [node]="child">
    </app-tree-node>
  </div>
</div>
